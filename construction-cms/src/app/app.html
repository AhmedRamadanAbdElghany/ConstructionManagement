@if (showLayout) {
<div class="flex h-screen bg-white dark:bg-slate-950 overflow-hidden transition-colors duration-500">
  <app-sidebar></app-sidebar>
  <div class="flex-1 flex flex-col overflow-hidden relative">
    <app-topbar></app-topbar>
    <main class="flex-1 overflow-x-hidden overflow-y-auto relative">
      @if (isNavigating) {
      <div
        class="absolute inset-0 z-[100] flex items-center justify-center bg-slate-50 dark:bg-slate-950 transition-all duration-300">
        <app-loading-spinner [centered]="true"></app-loading-spinner>
      </div>
      }
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
} @else {
@if (isNavigating) {
<div
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-50 dark:bg-slate-950 transition-all duration-300">
  <app-loading-spinner [centered]="true"></app-loading-spinner>
</div>
}
<router-outlet></router-outlet>
}
